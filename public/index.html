<!DOCTYPE html>
<html>
<head>
    <title>ConnectX</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #messages {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 200px;
        }

        .system {
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>ConnectX
        <p id="connectionStatus">
    Connecting...
</p>
    </h1>

    <!-- Room information -->
    <div>
        <input
            id="username"
            type="text"
            placeholder="Username"
        >

        <input
            id="room"
            type="text"
            placeholder="Room name"
        >

        <button id="joinButton">
            Join Room
        </button>
    </div>

    <hr>

    <!-- Message section -->
    <div>
        <input
            id="messageInput"
            type="text"
            placeholder="Enter message"
        >

        <button id="sendButton">
            Send
        </button>
    </div>

    <div id="messages"></div>


    <!-- Socket.io client library -->
    <script src="/socket.io/socket.io.js"></script>

    <script>

        // ==========================================
        // 1. CREATE SOCKET CONNECTION
        // ==========================================

        const socket = io();


        // ==========================================
        // 2. GET HTML ELEMENTS
        // ==========================================

        const usernameInput =
            document.getElementById("username");

        const roomInput =
            document.getElementById("room");

        const joinButton =
            document.getElementById("joinButton");

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const messages =
            document.getElementById("messages");
        const connectionStatus =document.getElementById("connectionStatus");


        // ==========================================
        // 3. STORE CURRENT USER/ROOM
        // ==========================================

        let currentUsername = "";
        let currentRoom = "";


        // ==========================================
        // 4. CONNECTION EVENT
        // ==========================================

        socket.on("connect", () => {

    console.log("Connected:", socket.id);

    connectionStatus.textContent = "🟢 Connected";

    if (currentUsername && currentRoom) {

        socket.emit(
            "joinRoom",
            {
                username: currentUsername,
                room: currentRoom
            },
            (response) => {

                if (response.success) {

                    addSystemMessage(
                        "Reconnected to " + currentRoom
                    );
                }
            }
        );
    }
});


        // ==========================================
        // 5. DISCONNECT EVENT
        // ==========================================

        socket.on("disconnect", (reason) => {

    console.log("Disconnected:", reason);

    connectionStatus.textContent =
        "🔴 Disconnected";
});

        // ==========================================
        // 6. JOIN ROOM
        // ==========================================

        joinButton.addEventListener("click", () => {

            const username =
                usernameInput.value.trim();

            const room =
                roomInput.value.trim();


            socket.emit(
                "joinRoom",

                {
                    username: username,
                    room: room
                },

                // Server acknowledgement
                (response) => {

                    console.log(
                        "Server response:",
                        response
                    );

                    if (response.success) {

                        // Remember these values so that
                        // we can rejoin after reconnecting.

                        currentUsername = username;
                        currentRoom = room;

                        addSystemMessage(
                            response.message
                        );

                    } else {

                        alert(response.message);
                    }
                }
            );
        });


        // ==========================================
        // 7. SEND MESSAGE
        // ==========================================

        sendButton.addEventListener("click", () => {

            const message =
                messageInput.value;

            socket.emit(
                "sendMessage",
                message
            );

            messageInput.value = "";
        });


        // ==========================================
        // 8. RECEIVE CHAT MESSAGE
        // ==========================================

        socket.on("newMessage", (data) => {

            const messageElement =
                document.createElement("p");

            messageElement.textContent =
                `${data.username}: ${data.message}`;

            messages.appendChild(messageElement);
        });


        // ==========================================
        // 9. RECEIVE SYSTEM MESSAGE
        // ==========================================

        socket.on("systemMessage", (data) => {

            addSystemMessage(data.message);
        });


        // ==========================================
        // 10. RECEIVE ERROR MESSAGE
        // ==========================================

        socket.on("errorMessage", (data) => {

            alert(data.message);
        });


        // ==========================================
        // 11. HELPER FUNCTION
        // ==========================================

        function addSystemMessage(message) {

            const messageElement =
                document.createElement("p");

            messageElement.classList.add("system");

            messageElement.textContent =
                message;

            messages.appendChild(messageElement);
        }

    </script>

</body>
</html>
